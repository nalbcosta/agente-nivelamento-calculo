[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-nivelamento-backend"
version = "0.1.0"
description = "Backend FastAPI para agente de nivelamento em Calculo I"
requires-python = ">=3.11"
dependencies = [
	"alembic>=1.13.0",
	"fastembed>=0.4.0",
	"fastapi>=0.115.0",
	"httpx>=0.27.0",
	"langchain>=0.3.0",
	"langchain-community>=0.3.0",
	"langchain-core>=0.3.0",
	"langchain-huggingface>=0.1.0",
	"langchain-ollama>=0.2.0",
	"pgvector>=0.3.5",
	"pydantic-settings>=2.3.0",
	"psycopg[binary]>=3.1.0",
	"python-dotenv>=1.0.0",
	"sqlalchemy>=2.0.0",
	"uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0",
]
