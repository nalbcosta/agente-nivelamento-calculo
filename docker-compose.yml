services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agente_nivelamento
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '5438:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agente_nivelamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - '11434:11434'
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
